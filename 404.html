<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página no encontrada | IA System</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="canonical" href="https://iamarketing.mx/"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      min-height: 100vh;
      background: #0d0d0d; color: #f0ebe0;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 36rem; text-align: center; }
    .code {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 400; line-height: 1;
      color: #1c1c1c; display: block; margin-bottom: 2rem;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 400; color: #f0ebe0;
      margin-bottom: 1rem; line-height: 1.2;
    }
    p {
      font-size: 0.9375rem; font-weight: 300;
      color: #7a7067; line-height: 1.7; margin-bottom: 2.5rem;
    }
    a.btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: #c9a962; color: #0d0d0d;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.9375rem; font-weight: 600;
      padding: 0.875rem 2rem; border-radius: 2px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    a.btn:hover { background: #dfc07e; }
  </style>
</head>
<body>
  <div class="container">
    <span class="code">404</span>
    <h1>Esta página no existe.</h1>
    <p>La página que buscas no está disponible o fue movida. Vuelve al inicio para conocer el sistema.</p>
    <a href="/" class="btn">
      Volver al inicio
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</body>
</html>
