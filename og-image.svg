  <line x1="0" y1="1" x2="1200" y2="1" stroke="#1c1c1c" stroke-width="1"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#1c1c1c" stroke-width="1"/>
  <!-- Linea dorada acento -->
  <rect x="80" y="260" width="48" height="1" fill="#c9a962"/>
