  <text x="80" y="240" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#c9a962" letter-spacing="3">SISTEMA DE CONVERSION DIGITAL</text>
  <!-- Headline principal -->
  <text x="80" y="320" font-family="Georgia, serif" font-size="64" font-weight="400" fill="#f0ebe0">Tu expertise merece</text>
  <text x="80" y="395" font-family="Georgia, serif" font-size="64" font-weight="400" fill="#f0ebe0">un sistema que</text>
